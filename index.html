<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basit Tarayici Sayfasi</title>
  <style>
    :root {
      --bg: #09090b;
      --panel: #111113;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #3f3f46;
      --hover: #e4e4e7;
      --hoverText: #09090b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .wrap {
      width: 100%;
      max-width: 860px;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 10px;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.1;
    }
    .desc {
      margin-top: 14px;
      color: var(--muted);
      max-width: 700px;
      line-height: 1.5;
    }
    form {
      margin-top: 28px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    input {
      flex: 1 1 480px;
      height: 48px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 0 14px;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: #d4d4d8;
    }
    button {
      height: 48px;
      border: 1px solid #d4d4d8;
      background: transparent;
      color: var(--text);
      font-weight: 700;
      padding: 0 18px;
      cursor: pointer;
    }
    button:hover {
      background: var(--hover);
      color: var(--hoverText);
    }
    .status {
      margin-top: 14px;
      font-size: 14px;
      color: var(--muted);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">GitHub Project</p>
    <h1>Proje sifirlandi</h1>
    <p class="desc">
      Adres yaz, ayni sekmede ac. (Yeni sekme yok.)
    </p>

    <form id="openForm">
      <input
        id="urlInput"
        type="text"
        value="https://github.com"
        placeholder="ornek: github.com"
        autocomplete="off"
      />
      <button type="submit">Ayni Sekmede Ac</button>
    </form>

    <p id="status" class="status">Henuz bir adres acilmadi.</p>
  </main>

  <script>
    const form = document.getElementById("openForm");
    const input = document.getElementById("urlInput");
    const status = document.getElementById("status");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const raw = input.value.trim();
      if (!raw) return;

      const formatted = /^https?:\/\//i.test(raw) ? raw : "https://" + raw;
      status.textContent = "Son acilan adres: " + formatted;

      // Ayni sekmede ac
      window.location.assign(formatted);
    });
  </script>
</body>
</html>
