<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Browser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #1e1e1e; color: white; }
        
        /* -- Adres Cubugu -- */
        .browser-bar {
            height: 48px;
            background: #2d2d2d;
            display: flex;
            align-items: center;
            padding: 0 8px;
            border-bottom: 1px solid #111;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .controls { display: flex; gap: 4px; margin-right: 8px; }
        .btn {
            width: 28px; height: 28px; border-radius: 4px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; color: #aaa; background: transparent;
            font-size: 16px;
        }
        .btn:hover { background: #3d3d3d; color: white; }

        .address-container { flex: 1; display: flex; position: relative; }
        input {
            width: 100%; height: 32px; background: #1e1e1e; border: 1px solid #3d3d3d;
            color: #e0e0e0; padding: 0 12px; border-radius: 4px; outline: none;
            font-size: 13px; font-family: monospace;
        }
        input:focus { border-color: #555; background: #252525; }

        .go-btn {
            margin-left: 8px; padding: 0 16px; height: 32px; border-radius: 4px;
            background: #238636; color: white; border: none; cursor: pointer; font-weight: 600; font-size: 13px;
        }
        .go-btn:hover { background: #2ea043; }

        /* -- Oyun Alani -- */
        .frame-wrapper {
            flex: 1; position: relative; background: #fff;
        }
        iframe {
            width: 100%; height: 100%; border: none; display: block;
        }
    </style>
</head>
<body>

    <div class="browser-bar">
        <div class="controls">
            <button class="btn" onclick="history.back()" title="Geri">←</button>
            <button class="btn" onclick="history.forward()" title="İleri">→</button>
            <button class="btn" onclick="location.reload()" title="Yenile">↻</button>
            <button class="btn" onclick="toggleFullScreen()" title="Tam Ekran">⛶</button>
        </div>
        <div class="address-container">
            <input type="text" id="urlInput" placeholder="https://ornek.com" value="moomoo.io">
        </div>
        <button class="go-btn" onclick="navigate()">Git</button>
    </div>

    <div class="frame-wrapper">
        <!-- Yazilar kaldirildi, sadece oyun/site alani -->
        <iframe 
            id="browserFrame" 
            src="" 
            allowfullscreen="true"
            allow="autoplay; fullscreen; microphone; camera; midi; geolocation; gyroscope; magnetometer; accelerometer; clipboard-read; clipboard-write; payment"
            sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
            referrerpolicy="no-referrer">
        </iframe>
    </div>

    <script>
        const frame = document.getElementById('browserFrame');
        const input = document.getElementById('urlInput');

        function navigate() {
            let val = input.value.trim();
            if (!val) return;
            
            // Protokol ekle
            if (!val.startsWith('http')) {
                if(val.includes('moomoo') && !val.includes('https')) {
                    val = 'https://' + val;
                } else {
                    val = 'https://' + val;
                }
            }
            
            input.value = val;
            frame.src = val;
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') navigate();
        });
    </script>
</body>
</html>
