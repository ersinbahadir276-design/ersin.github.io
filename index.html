<!DOCTYPE html>
<html>
<head>
    <title>MooMoo Tarzı Oyun</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            cursor: none;
        }
        /* UI */
        #ui {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            z-index: 100;
        }
        .kaynak {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        /* Can barı */
        #canBarContainer {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            z-index: 100;
        }
        #canLabel {
            color: white;
            font-size: 12px;
            text-align: center;
            margin-bottom: 3px;
        }
        #canBar {
            width: 100%;
            height: 15px;
            background: rgba(255,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
        }
        #canDolu {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff0000);
            border-radius: 10px;
            transition: width 0.3s;
        }
        /* Level bar */
        #levelBarContainer {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            z-index: 100;
        }
        #levelLabel {
            color: #ffd700;
            font-size: 12px;
            text-align: center;
            margin-bottom: 3px;
        }
        #levelBar {
            width: 100%;
            height: 10px;
            background: rgba(255,215,0,0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,215,0,0.3);
        }
        #levelDolu {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            border-radius: 10px;
            transition: width 0.3s;
        }
        /* Yapı menüsü */
        #yapiMenu {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .yapiBtn {
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            min-width: 70px;
        }
        .yapiBtn.aktif {
            border-color: #ffd700;
            background: rgba(255,215,0,0.2);
        }
        /* Mobil joystick */
        #joystickContainer {
            position: fixed;
            bottom: 120px;
            left: 40px;
            width: 120px;
            height: 120px;
            z-index: 100;
            display: none;
        }
        #joystickBase {
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.1);
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            position: absolute;
        }
        #joystickStick {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.5);
            border: 3px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            position: absolute;
            top: 35px;
            left: 35px;
        }
        /* Saldırı butonu */
        #saldiríBtn {
            position: fixed;
            bottom: 130px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: rgba(255,50,50,0.6);
            border: 3px solid rgba(255,100,100,0.8);
            border-radius: 50%;
            color: white;
            font-size: 30px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
        }
        /* Level up bildirimi */
        #levelUp {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,215,0,0.9);
            color: #000;
            padding: 20px 40px;
            border-radius: 20px;
            font-size: 28px;
            font-weight: bold;
            display: none;
            z-index: 200;
            animation: fadeOut 2s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(1.2); }
        }
        /* Ölüm ekranı */
        #olumEkrani {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            color: white;
        }
        #olumEkrani h1 {
            font-size: 48px;
            color: #ff4444;
            margin-bottom: 20px;
        }
        #yenidenBtn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>

<!-- Mobil Joystick -->

</div>
