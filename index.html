 <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Browser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #1e1e1e; color: white; }
        
        /* Adres Cubugu Tasarimi */
        .browser-bar {
            height: 48px;
            background: #2d2d2d;
            display: flex;
            align-items: center;
            padding: 0 8px;
            border-bottom: 1px solid #111;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .controls { display: flex; gap: 4px; margin-right: 8px; }
        .btn {
            width: 28px; height: 28px; border-radius: 4px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; color: #aaa; background: transparent;
            font-size: 16px;
        }
        .btn:hover { background: #3d3d3d; color: white; }

        .address-container { flex: 1; display: flex; position: relative; }
        input {
            width: 100%; height: 32px; background: #1e1e1e; border: 1px solid #3d3d3d;
            color: #e0e0e0; padding: 0 12px; border-radius: 4px; outline: none;
            font-size: 13px; font-family: monospace;
        }
        input:focus { border-color: #555; background: #252525; }

        .go-btn {
            margin-left: 8px; padding: 0 16px; height: 32px; border-radius: 4px;
            background: #238636; color: white; border: none; cursor: pointer; font-weight: 600; font-size: 13px;
        }
        .go-btn:hover { background: #2ea043; }

        /* Iframe Alani */
        .frame-wrapper {
            flex: 1; position: relative; background: white;
        }
        iframe {
            width: 100%; height: 100%; border: none; display: block;
        }
        
        .info-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #333; font-size: 14px; pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div class="browser-bar">
        <div class="controls">
            <button class="btn" onclick="history.back()">←</button>
            <button class="btn" onclick="history.forward()">→</button>
            <button class="btn" onclick="location.reload()">↻</button>
        </div>
        <div class="address-container">
            <input type="text" id="urlInput" placeholder="https://ornek.com" value="https://bing.com">
        </div>
        <button class="go-btn" onclick="navigate()">Git</button>
    </div>

    <div class="frame-wrapper">
        <div class="info-msg">
            Site yukleniyor...<br><br>
            <small style="color:#666">Eger burasi beyaz kalirsa, o site iframe icinde acilmaya izin vermiyordur (Guvenlik).</small>
        </div>
        <!-- Sandbox: allow-same-origin ve allow-scripts onemli -->
        <iframe id="browserFrame" src="https://bing.com" sandbox="allow-forms allow-pointer-lock allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation"></iframe>
    </div>

    <script>
        const frame = document.getElementById('browserFrame');
        const input = document.getElementById('urlInput');

        function navigate() {
            let val = input.value.trim();
            if (!val) return;
            
            // Protokol ekle
            if (!val.startsWith('http')) {
                val = 'https://' + val;
            }
            
            input.value = val;
            frame.src = val;
        }

        // Enter tusuna basinca git
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') navigate();
        });
    </script>
</body>
</html>
